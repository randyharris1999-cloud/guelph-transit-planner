<title>Guelph Transit Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>/*LEAFLET_CSS*/</style>
<style>
/* Layout: full-height map with a survey-sheet side panel (stacks under the map on phones) */
:root{
  --bg:#F2F3EF; --panel:#FBFBF8; --ink:#1C2A2D; --muted:#5D6A6C; --rule:#DCDFD8; --chip:#ECEEE8;
  --accent:#00A6E5; --accent-ink:#06303F; --accent-text:#0079A8; --brand-green:#85B24A; --warn:#B4532A;
  --land:#E9EBE4; --park:#CFDEC2; --park-edge:#B4C9A4; --street:#FFFFFF; --case:#C6CAC1; --trail:#6E8F4E; --tree:#5B8A3A;
  --dim:rgba(233,235,228,.38);
  --water:#9FC6D6; --water-edge:#7FAFC2; --water-ink:#2F6F86; --bldg:#D3D4CB; --bldg-edge:#BBBEB2; --label:#4A5658; --halo:rgba(242,243,239,.92);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101617; --panel:#151C1D; --ink:#E4EBE9; --muted:#97A5A4; --rule:#273133; --chip:#1E2729;
  --accent:#00A6E5; --accent-ink:#06232E; --accent-text:#3DC1F0; --brand-green:#85B24A; --warn:#E08A5F;
  --land:#172022; --park:#1F3326; --park-edge:#2C4733; --street:#2E3A3C; --case:#0C1112; --trail:#6E9A5E; --tree:#6FA352;
  --dim:rgba(23,32,34,.45); --water:#1F4E63; --water-edge:#2C6178; --water-ink:#7DB9CF; --bldg:#252F31; --bldg-edge:#323E40; --label:#AAB7B6; --halo:rgba(16,22,23,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101617; --panel:#151C1D; --ink:#E4EBE9; --muted:#97A5A4; --rule:#273133; --chip:#1E2729;
  --accent:#00A6E5; --accent-ink:#06232E; --accent-text:#3DC1F0; --brand-green:#85B24A; --warn:#E08A5F;
  --land:#172022; --park:#1F3326; --park-edge:#2C4733; --street:#2E3A3C; --case:#0C1112; --trail:#6E9A5E; --tree:#6FA352;
  --dim:rgba(23,32,34,.45); --water:#1F4E63; --water-edge:#2C6178; --water-ink:#7DB9CF; --bldg:#252F31; --bldg-edge:#323E40; --label:#AAB7B6; --halo:rgba(16,22,23,.9); color-scheme:dark}
html,body{height:100%}
input[type=range]{accent-color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{height:100%;display:grid;grid-template-columns:minmax(340px,420px) 1fr}
.panel{background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
#map{background:var(--land);height:100%;min-height:300px}
header h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.2px;margin:0;text-wrap:balance}
header h1 span{color:var(--accent-text)}
.brandbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-bottom:12px;width:96px}
.brandbar i{flex:2;background:var(--accent)}.brandbar i+i{flex:1;background:var(--brand-green)}
.tabs button[aria-pressed="true"]{font-weight:700}
.ico{width:22px;height:22px;display:block}
.disclaimer{font-size:11px;color:var(--muted)}
.livelist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.lrow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px}
.lrow small{display:block;color:var(--muted);font-size:12px}
.lrow .st{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.ldot.ok{background:var(--brand-green);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-green) 25%,transparent)}
.ldot.wait{background:var(--accent)}
.ldot.bad{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.ldot.ok{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--brand-green) 0%,transparent)}}}
.toggles{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent);width:16px;height:16px}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.alert{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--rule));background:color-mix(in srgb,var(--warn) 9%,var(--panel));border-radius:8px;padding:8px 10px;font-size:12px}
.alert summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert summary svg{flex:none;margin-top:1px}
.alert p{margin:6px 0 0;white-space:pre-line;color:var(--muted)}
.late{font-size:10px;font-family:var(--f-mono);padding:0 4px;border-radius:3px;margin-left:4px;color:var(--panel);background:var(--warn)}
.ontime{font-size:10px;font-family:var(--f-mono);padding:0 4px;border-radius:3px;margin-left:4px;color:var(--accent-ink);background:var(--brand-green)}
.livetag{display:inline-flex;gap:4px;align-items:center;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-text);margin-left:6px}
.livetag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand-green)}
.busm svg{display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
header p{margin:6px 0 0;color:var(--muted);font-size:13px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:11px 12px 11px 36px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:11px;top:12px;width:16px;height:16px;stroke:var(--muted)}
.sugg{position:absolute;z-index:1000;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden;margin:0;padding:0;list-style:none}
.sugg li{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--chip)}
.sugg small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.sample{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);font-weight:600;margin-bottom:2px}
.card-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dial{width:92px;height:92px;position:relative}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.dial b small{display:block;font-size:11px;font-family:var(--f-mono);color:var(--muted);font-weight:400;margin-top:-26px}
.addr h2{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
.grade{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 em{font-style:normal;text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:400}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;width:100%}
.row:hover,.row.on{background:var(--chip)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:10px;height:10px;border-radius:50%}
.row{grid-template-columns:22px 1fr auto!important}
.row .lbl{min-width:0}
.row .lbl b{font-weight:600}
.row .lbl div{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.meter{width:58px;height:4px;background:var(--rule);border-radius:2px;margin-top:4px;margin-left:auto}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tabs button{font:inherit;font-weight:600;font-size:13px;padding:9px 4px;border:0;background:var(--bg);color:var(--muted);cursor:pointer}
.tabs button+button{border-left:1px solid var(--rule)}
.eq{display:grid;grid-template-columns:1fr 110px 34px;gap:4px 10px;align-items:center;font-size:13px;margin-top:8px}
.eq .bar{height:8px;background:var(--rule);border-radius:2px;position:relative}
.eq .bar i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.eq .bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.eq span:nth-child(3n){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.panel.census #card,.panel.census #secNear,.panel.census #secBus,.panel.census #secTrees{display:none}
.insight{margin:12px 0 0;padding:10px 12px;background:var(--chip);border-radius:8px;font-size:13px}
.dagrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:8px}
.dagrid div{display:flex;flex-direction:column}
.dagrid small{font-size:11px;color:var(--muted)}
.dagrid b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.legend .sw{display:grid;grid-template-columns:12px 1fr;gap:3px 6px;align-items:center;font-family:var(--f-mono)}
.legend .sw i{width:12px;height:10px;border-radius:2px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ctrls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px}
.ctrls select,.ctrls input[type=range]{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px}
.ctrls .full{grid-column:1/-1}
.ctrls output{font-family:var(--f-mono);color:var(--ink);text-transform:none;letter-spacing:0}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:flex;gap:12px;align-items:baseline;margin-top:12px}
.stat p{margin:0;color:var(--muted);font-size:13px}
.deps{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.rchip{font-family:var(--f-display);font-weight:700;font-size:15px;min-width:30px;text-align:center;padding:1px 6px;border-radius:5px;color:#fff}
.dep .lbl{min-width:0}.dep .lbl div{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .times{font-family:var(--f-mono);font-size:12px;text-align:right}
.trees{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trees span{background:var(--chip);border-radius:99px;padding:3px 9px;font-size:12px}
details{border-top:1px solid var(--rule);padding-top:10px;font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--ink);font-weight:600}
details table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
details td{padding:4px 0;border-bottom:1px solid var(--rule)}
details td:last-child{text-align:right;font-family:var(--f-mono)}
footer{font-size:11px;color:var(--muted);margin-top:auto}
.legend{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:0 2px 10px rgba(0,0,0,.12);min-width:170px}
.legend b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;color:var(--muted)}
.legend .ramp{display:flex;height:8px;border-radius:2px;overflow:hidden}
.legend .ramp i{flex:1}
.legend .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);margin-top:3px}
.leaflet-container{background:var(--land);font-family:var(--f-body)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--rule)}
.leaflet-bar a:hover{background:var(--chip)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important}
.pin{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.35)}
.tag{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.leaflet-tooltip.tt{background:var(--panel);color:var(--ink);border:1px solid var(--rule);box-shadow:0 2px 8px rgba(0,0,0,.18);font-family:var(--f-body)}
.leaflet-tooltip.tt::before{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--land);z-index:2000;font-family:var(--f-mono);color:var(--muted)}
@media (max-width:760px){
  .app{display:flex;flex-direction:column-reverse;height:auto}
  #map{height:56vh;flex:none}
  .panel{border-right:0;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
